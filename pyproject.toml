[project]
name = "aguilar2026-features"
version = "0.1.0"
description = "Cancelable multimodal (ECG+PPG) biometrics via BioHashing on wavelet features"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Diego Aguilar" }]
keywords = [
    "cancelable-biometrics",
    "biohashing",
    "ecg",
    "ppg",
    "wavelet",
    "random-projection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]

# Pinned to the same versions as the signal-domain sibling project so the two
# can share a resolved environment. Run `uv sync` in a fresh environment to
# reproduce the reported numbers.
dependencies = [
    "numpy==2.4.4",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "scikit-image==0.26.0",
    "pywavelets==1.9.0",
    "neurokit2==0.2.13",
    "pyeer==0.5.6",
    "pingouin==0.6.1",
    "cliffs-delta==1.0.0",
    "statsmodels==0.14.6",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "pandas==2.3.3",
    "polars>=1.41.0",
    "setuptools>=75,<81",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mwf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:pyeer",
]
